{% load localization_tags %}
<section class="section shell" aria-labelledby="index-title">
  <h2 id="index-title" class="subheading muted mb-8">{% t "index.title" %}</h2>
  <nav class="index-list" aria-labelledby="index-title">
    {% for section in navigation_sections %}
      <a href="{{ section.url }}" class="index-row">
        <span class="index-word">{{ section.title|translate_content }}</span>
        <span class="index-desc">{{ section.description|translate_content }}</span>
        <span class="index-glyph {% cycle 'glyph-circle' 'glyph-square' 'glyph-bar' 'glyph-half' 'glyph-ring' %}" aria-hidden="true"></span>
      </a>
    {% endfor %}
  </nav>
</section>
