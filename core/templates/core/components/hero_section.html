{% load localization_tags %}
<section class="hero shell" aria-labelledby="hero-title" data-hero>
  {# Suprematist composition read as an agent graph: planes are tools, the line is the plan, the dot is the running agent. #}
  <div class="composition" aria-hidden="true">
    <svg viewBox="0 0 640 720" preserveAspectRatio="xMidYMid meet" role="presentation" focusable="false">
      <g class="depth" data-depth="0.35">
        <g class="enter" style="--fx:-60px; --fy:-140px; --fr:-30deg; --d:0ms">
          <rect x="170" y="90" width="300" height="420" transform="rotate(-14 320 300)" fill="var(--color-cobalt)"/>
        </g>
      </g>
      <g class="depth" data-depth="0.9">
        <g class="enter" style="--fx:160px; --fy:40px; --fr:0deg; --fs:0.4; --d:180ms">
          <rect x="40" y="330" width="560" height="14" transform="rotate(22 320 337)" fill="var(--color-bone)"/>
        </g>
      </g>
      <g class="depth" data-depth="0.6">
        <g class="enter" style="--fx:0px; --fy:-60px; --fr:45deg; --fs:0.6; --d:260ms">
          <rect x="300" y="210" width="110" height="110" fill="var(--color-void)"/>
        </g>
      </g>
      <g class="depth" data-depth="1.2">
        <g class="enter" style="--fx:-120px; --fy:20px; --fr:90deg; --d:340ms">
          <rect x="96" y="150" width="64" height="64" fill="none" stroke="var(--color-bone)" stroke-width="2"/>
        </g>
      </g>
      <g class="depth" data-depth="0.75">
        <g class="enter" style="--fx:120px; --fy:160px; --fs:0.2; --d:420ms">
          <circle cx="470" cy="470" r="96" fill="var(--color-saffron)"/>
        </g>
      </g>
      <g class="depth" data-depth="0.5">
        <path id="agent-path" class="edge" d="M128 182 L355 265 L470 470 L230 600" fill="none" stroke="var(--color-bone)" stroke-opacity="0.7" stroke-width="1.25"/>
        <g class="enter" style="--fs:0; --d:1500ms">
          <circle cx="128" cy="182" r="5" fill="var(--color-bone)"/>
          <circle cx="355" cy="265" r="5" fill="var(--color-bone)"/>
          <circle cx="470" cy="470" r="5" fill="var(--color-void)"/>
          <circle cx="230" cy="600" r="5" fill="var(--color-bone)"/>
        </g>
        <circle class="signal" r="7" fill="var(--color-saffron)" stroke="var(--color-void)" stroke-width="2">
          <animateMotion dur="7s" repeatCount="indefinite" rotate="auto" keyPoints="0;1;1" keyTimes="0;0.7;1" calcMode="linear">
            <mpath href="#agent-path"/>
          </animateMotion>
        </circle>
      </g>
    </svg>
  </div>

  <div class="relative z-2">
    <h1 id="hero-title" class="hero-name display display-xl">
      <span class="line"><span>Dimitri</span></span>
      <span class="line"><span>Gaggioli</span></span>
    </h1>

    <div class="hero-copy mt-8 grid gap-8 md:mt-12 md:grid-cols-12 md:items-end">
      <p class="lede md:col-span-6">{% t "hero.statement" location=person.location %}</p>
      <div class="flex flex-wrap gap-3 md:col-span-6 md:justify-end">
        <a href="{% url 'projects:list' %}" class="btn btn-solid">{% t "hero.cta_projects" %}</a>
        <a href="mailto:{{ person.contact_email }}" class="btn btn-line">{% t "hero.cta_contact" %}</a>
      </div>
    </div>
  </div>
</section>
