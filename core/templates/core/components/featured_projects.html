{% load localization_tags %}
<section id="projects" class="section shell" aria-labelledby="featured-title">
  <div class="mb-12 flex flex-wrap items-end justify-between gap-6 md:mb-16">
    <h2 id="featured-title" class="display display-lg">{% t "featured.title" %}</h2>
    <a href="{{ archive_url }}" class="link">{% t "home.archive" %}</a>
  </div>

  {% if featured_projects %}
    <div class="work-grid grid gap-x-[clamp(1.5rem,5vw,5rem)] gap-y-16 md:grid-cols-2">
      {% for project in featured_projects %}
        {% include 'projects/components/project_card.html' with project=project %}
      {% endfor %}
    </div>
  {% else %}
    <p class="muted">{% t "featured.empty" %}</p>
  {% endif %}
</section>
