{% load localization_tags %}
<footer class="section" aria-labelledby="footer-title">
  <div class="shell">
    <div class="rule-top pt-14 md:pt-20">
      <h2 id="footer-title" class="subheading max-w-[28ch] text-ash">{% t "footer.prompt" %}</h2>
      <a href="mailto:{{ person.contact_email }}" class="footer-mail mt-6">{{ person.contact_email }}</a>
    </div>

    <div class="mt-16 grid gap-8 border-t border-(--rule) py-8 small md:grid-cols-3 md:items-center">
      <ul class="flex flex-wrap gap-x-6 gap-y-2">
        <li><a href="{{ person.github }}" target="_blank" rel="noopener noreferrer" class="link">GitHub</a></li>
        <li><a href="{{ person.linkedin }}" target="_blank" rel="noopener noreferrer" class="link">LinkedIn</a></li>
      </ul>
      <p class="muted md:text-center">{% t "footer.location" %}</p>
      <p class="muted md:text-right">© {% now "Y" %} Dimitri Gaggioli</p>
    </div>
  </div>
</footer>
