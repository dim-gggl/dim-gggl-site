{% load localization_tags %}
<!DOCTYPE html>
<html lang="{{ current_language }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maintenance - dim-gggl</title>
    <style>
      :root {
        --bg: #0a0b0d;
        --panel: #131518;
        --text: #f2f3f5;
        --muted: #9ba1a8;
        --accent: #a3e635;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--text);
        font-family: "Inter", system-ui, -apple-system, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card { max-width: 560px; }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: var(--accent);
        display: inline-block;
        margin-bottom: 32px;
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.8); }
      }
      h1 { font-size: 2rem; margin-bottom: 16px; letter-spacing: -0.02em; }
      p { color: var(--muted); line-height: 1.6; margin-bottom: 24px; }
      .contact {
        background: var(--panel);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 16px;
        padding: 24px;
      }
      .contact a {
        color: var(--accent);
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="dot"></span>
      <h1>{% t "maintenance.title" %}</h1>
      <p>{% t "maintenance.body" %}</p>
      <div class="contact">
        <p style="margin-bottom: 8px;">{% t "maintenance.contact_label" %}</p>
        <a href="mailto:dimitri.gaggioli@gmail.com">dimitri.gaggioli@gmail.com</a>
      </div>
    </div>
  </body>
</html>
