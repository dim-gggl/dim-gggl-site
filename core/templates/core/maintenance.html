{% load tailwind_tags %}
{% load localization_tags %}
<!DOCTYPE html>
<html lang="{{ current_language }}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Maintenance - dim-gggl</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
    {% tailwind_css %}
  </head>
  <body class="grid min-h-dvh place-items-center">
    <main class="shell grid gap-12 py-16 md:grid-cols-12 md:items-center">
      <div class="relative mx-auto h-48 w-48 md:col-span-4 md:h-64 md:w-64" aria-hidden="true">
        <span class="absolute inset-[12%] rotate-[-14deg] bg-cobalt"></span>
        <span class="absolute right-0 bottom-0 h-1/2 w-1/2 rounded-full bg-saffron"></span>
      </div>
      <div class="md:col-span-8">
        <h1 class="display display-md">{% t "maintenance.title" %}</h1>
        <p class="lede mt-6">{% t "maintenance.body" %}</p>
        <p class="small muted mt-10">{% t "maintenance.contact_label" %}</p>
        <a href="mailto:dimitri.gaggioli@gmail.com" class="link mt-2 inline-block text-xl font-semibold">dimitri.gaggioli@gmail.com</a>
      </div>
    </main>
  </body>
</html>
